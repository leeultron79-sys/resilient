name = "resililink-v3-api"
main = "src/worker.js"
compatibility_date = "2026-11-01"

# Replace with your real frontend origin. No trailing slash.
[vars]
ALLOWED_ORIGINS = "https://leeultron79-sys.github.io"

# Cloudflare Workers Rate Limiting binding; approximate, not a hard cost cap.
[[ratelimits]]
name = "MVP_RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 5
period = 60
