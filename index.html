<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResiliLink - AI 韌性協調引擎原型</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; background-color: #f3f4f6; }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [mode, setMode] = useState('personal'); 

            return (
                <div className="min-h-screen flex flex-col relative">
                    <header className="bg-white shadow-sm sticky top-0 z-10">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <i className="fa-solid fa-link text-blue-600 text-2xl"></i>
                                <span className="font-bold text-xl text-gray-900">ResiliLink</span>
                            </div>
                            <div className="flex bg-gray-100 p-1 rounded-lg">
                                <button onClick={() => setMode('personal')} className={`px-4 py-1.5 rounded-md text-sm font-medium transition-colors ${mode === 'personal' ? 'bg-white shadow text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}>個人模式 (Personal)</button>
                                <button onClick={() => setMode('community')} className={`px-4 py-1.5 rounded-md text-sm font-medium transition-colors ${mode === 'community' ? 'bg-white shadow text-green-600' : 'text-gray-500 hover:text-gray-700'}`}>社區模式 (Community)</button>
                            </div>
                        </div>
                    </header>

                    <main className="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
                        {mode === 'personal' ? <PersonalMode /> : <CommunityMode />}
                    </main>
                </div>
            );
        }

        // --- Weather Assessment Modal Component ---
        function WeatherAssessmentModal({ onClose }) {
            const [step, setStep] = useState(0);
            const [score, setScore] = useState(0);

            const questions = [
                { q: "1. 根據地理數據，你居住的地區是否屬於低窪地區（如杏花邨、鯉魚門等易水浸區域）？", options: [{label: "是，處於低窪地區", val: 2}, {label: "否，不是低窪地區", val: 0}] },
                { q: "2. 你家裡目前有沒有準備至少 3 天的乾糧及飲用水？", options: [{label: "完全沒有", val: 2}, {label: "有少量，不足3天", val: 1}, {label: "準備充足", val: 0}] },
                { q: "3. 家中窗戶是否已貼上防風膠紙並鎖緊？", options: [{label: "未處理", val: 1}, {label: "已完成", val: 0}] }
            ];

            const handleAnswer = (val) => {
                setScore(score + val);
                if (step < questions.length) setStep(step + 1);
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center modal-overlay fade-in p-4">
                    <div className="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden flex flex-col">
                        <div className="bg-blue-600 p-4 text-white flex justify-between items-center">
                            <h3 className="font-bold"><i className="fa-solid fa-cloud-bolt mr-2"></i>極端天氣防禦力評估</h3>
                            <button onClick={onClose} className="text-white hover:text-blue-200"><i className="fa-solid fa-times text-lg"></i></button>
                        </div>
                        
                        <div className="p-6">
                            {step < questions.length ? (
                                <div className="fade-in">
                                    <div className="text-xs text-blue-500 font-bold mb-2">問題 {step + 1} / {questions.length}</div>
                                    <h4 className="text-gray-800 font-medium text-lg mb-6">{questions[step].q}</h4>
                                    <div className="space-y-3">
                                        {questions[step].options.map((opt, i) => (
                                            <button key={i} onClick={() => handleAnswer(opt.val)} className="w-full text-left p-3 border border-gray-200 rounded-lg hover:border-blue-500 hover:bg-blue-50 transition text-sm text-gray-700">
                                                {opt.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            ) : (
                                <div className="fade-in text-center py-4">
                                    <div className="inline-flex items-center justify-center w-16 h-16 rounded-full bg-orange-100 text-orange-500 mb-4 text-3xl">
                                        <i className="fa-solid fa-shield-halved"></i>
                                    </div>
                                    <h4 className="text-gray-800 font-bold text-xl mb-2">防禦評估結果</h4>
                                    <p className="text-sm text-gray-600 mb-6">
                                        你的家居極端天氣防禦力屬於 
                                        <strong className={`ml-1 ${score > 2 ? 'text-red-500' : (score > 0 ? 'text-orange-500' : 'text-green-500')}`}>
                                            {score > 2 ? '高危 (未準備)' : (score > 0 ? '中度風險' : '安全 (準備充足)')}
                                        </strong>。
                                    </p>
                                    <div className="bg-gray-50 p-4 rounded-lg text-left text-sm text-gray-700 mb-6 border border-gray-100">
                                        <div className="font-bold text-gray-800 mb-1"><i className="fa-solid fa-gear text-blue-500 mr-2"></i>自動化協調行動：</div>
                                        <ul className="list-disc pl-5 space-y-1">
                                            {score > 2 && <li className="text-red-600 font-medium">已觸發高危警報：系統將為你配對區內民政事務處臨時庇護中心資訊。</li>}
                                            <li>自動生成「附近超市及五金舖營業地圖」</li>
                                            <li>已通知所屬屋苑法團，將你列入特別關注名單</li>
                                        </ul>
                                    </div>
                                    <button onClick={onClose} className="bg-blue-600 text-white w-full py-2.5 rounded-lg font-medium hover:bg-blue-700 transition">
                                        完成並返回計劃
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // --- Personal Mode Component ---
        function PersonalMode() {
            const [chatInput, setChatInput] = useState('');
            const [messages, setMessages] = useState([
                { sender: 'ai', text: '你好！我是你的 ResiliLink 韌性助理。最近生活上有遇到什麼挑戰或讓你擔心的事嗎？' }
            ]);
            const [tasks, setTasks] = useState([]);
            const [isThinking, setIsThinking] = useState(false);
            const [showWeatherAssessment, setShowWeatherAssessment] = useState(false);
            const [systemLog, setSystemLog] = useState('');

            const handleSend = () => {
                if (!chatInput.trim()) return;
                setMessages(prev => [...prev, { sender: 'user', text: chatInput }]);
                const currentInput = chatInput;
                setChatInput('');
                setIsThinking(true);
                
                // Simulate RAG Database Retrieval Logging
                setSystemLog('🔍 正在檢索 Vector Database...');
                
                setTimeout(() => {
                    setSystemLog('📂 找到相關文件: HKO-TYPHOON-001 (天文台極端天氣指引)');
                }, 800);

                setTimeout(() => {
                    setIsThinking(false);
                    setSystemLog('');
                    
                    setMessages(prev => [...prev, { 
                        sender: 'ai', 
                        text: '收到。我已經從知識庫中檢索了最新的天文台及民政署防風指引。請根據右側的清單，立即進行評估與準備。' 
                    }]);
                    
                    if (currentInput.includes('風') || currentInput.includes('天氣') || currentInput.includes('雨')) {
                        setTasks([
                            { id: 'w1', phase: 'Assess', title: '極端天氣防禦力評估', desc: '點擊進行快速評估，確認防水設施及物資準備進度。', icon: 'fa-cloud-bolt', color: 'text-orange-500', isInteractive: true },
                            { id: 'w2', phase: 'Recommend', title: '準備擋水板及乾糧', desc: '根據 HKO-001 指引，低窪地區需提早安裝擋水板並儲備3天糧水。', icon: 'fa-box-open', color: 'text-blue-500' },
                            { id: 'w3', phase: 'Connect', title: '獲取臨時庇護中心資訊', desc: '已為你檢索最近的民政署庇護中心 (XX社區中心)，點擊查看地圖。', icon: 'fa-map-location-dot', color: 'text-green-500' },
                            { id: 'w4', phase: 'Adapt', title: '天氣警報連動', desc: '系統已連接天文台 API，將在改發八號信號前 2 小時向你發送 SMS 提醒。', icon: 'fa-satellite-dish', color: 'text-purple-500' }
                        ]);
                    }
                }, 2000);
            };

            const handleActionClick = (task) => {
                if (task.isInteractive) {
                    setShowWeatherAssessment(true);
                } else {
                    alert('自動化協調引擎運作中：此按鈕將連接外部 API 或資源庫。');
                }
            };

            return (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-8 h-full fade-in">
                    {showWeatherAssessment && <WeatherAssessmentModal onClose={() => setShowWeatherAssessment(false)} />}
                    {/* Chat Interface */}
                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col h-[600px]">
                        <div className="p-4 border-b border-gray-100 bg-blue-50 rounded-t-xl">
                            <h2 className="font-semibold text-blue-800"><i className="fa-solid fa-robot mr-2"></i>AI 助理對話 (含 RAG 檢索)</h2>
                        </div>
                        <div className="flex-grow p-4 overflow-y-auto space-y-4 bg-gray-50">
                            {messages.map((msg, idx) => (
                                <div key={idx} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`max-w-[80%] rounded-lg p-3 text-sm ${msg.sender === 'user' ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white text-gray-800 shadow-sm border border-gray-100 rounded-bl-none'}`}>
                                        {msg.text}
                                    </div>
                                </div>
                            ))}
                            {isThinking && (
                                <div className="flex flex-col gap-2 fade-in">
                                    <div className="bg-white text-gray-500 shadow-sm border border-gray-100 rounded-lg rounded-bl-none p-3 text-sm flex gap-1 w-fit">
                                        <span className="animate-bounce">.</span><span className="animate-bounce" style={{animationDelay: '0.2s'}}>.</span><span className="animate-bounce" style={{animationDelay: '0.4s'}}>.</span>
                                    </div>
                                    <div className="text-xs text-blue-600 ml-2 font-mono">
                                        <i className="fa-solid fa-database mr-1"></i>{systemLog}
                                    </div>
                                </div>
                            )}
                        </div>
                        <div className="p-4 bg-white border-t border-gray-100 rounded-b-xl">
                            <div className="flex gap-2">
                                <input 
                                    type="text" 
                                    value={chatInput}
                                    onChange={(e) => setChatInput(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && handleSend()}
                                    placeholder="試輸入：「聽日打風屋企會漏水點算？」" 
                                    className="flex-grow border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-blue-500"
                                />
                                <button onClick={handleSend} className="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
                                    <i className="fa-solid fa-paper-plane"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Orchestration Output (Tasks) */}
                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col h-[600px] overflow-hidden">
                        <div className="p-4 border-b border-gray-100 bg-gray-50">
                            <h2 className="font-semibold text-gray-800"><i className="fa-solid fa-list-check mr-2"></i>自動化防禦行動清單</h2>
                        </div>
                        <div className="flex-grow p-6 overflow-y-auto bg-white">
                            {tasks.length === 0 ? (
                                <div className="h-full flex flex-col items-center justify-center text-gray-400">
                                    <i className="fa-solid fa-cloud-showers-water text-4xl mb-3 opacity-50"></i>
                                    <p className="text-sm">輸入極端天氣相關問題</p>
                                    <p className="text-xs mt-1">測試 RAG 數據庫自動協調功能</p>
                                </div>
                            ) : (
                                <div className="space-y-6 fade-in relative before:absolute before:inset-0 before:ml-5 before:-translate-x-px md:before:mx-auto md:before:translate-x-0 before:h-full before:w-0.5 before:bg-gradient-to-b before:from-transparent before:via-gray-200 before:to-transparent">
                                    {tasks.map((task, idx) => (
                                        <div key={idx} className="relative flex items-center justify-between md:justify-normal md:odd:flex-row-reverse group is-active">
                                            <div className="flex items-center justify-center w-10 h-10 rounded-full border-4 border-white bg-blue-50 text-blue-500 shadow shrink-0 md:order-1 md:group-odd:-translate-x-1/2 md:group-even:translate-x-1/2 z-10">
                                                <i className={`fa-solid ${task.icon} ${task.color}`}></i>
                                            </div>
                                            <div className="w-[calc(100%-4rem)] md:w-[calc(50%-2.5rem)] p-4 rounded-xl border border-gray-100 shadow-sm bg-white hover:border-blue-200 transition">
                                                <div className="flex items-center justify-between mb-1">
                                                    <span className={`text-xs font-bold uppercase tracking-wider ${task.color}`}>{task.phase}</span>
                                                </div>
                                                <h3 className="font-bold text-gray-800 text-sm">{task.title}</h3>
                                                <p className="text-sm text-gray-600 mt-1">{task.desc}</p>
                                                <button onClick={() => handleActionClick(task)} className={`mt-3 text-xs py-1.5 px-3 rounded-md transition font-medium w-full ${task.isInteractive ? 'bg-orange-100 text-orange-700 hover:bg-orange-200 border border-orange-200' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}>
                                                    {task.isInteractive ? '▶ 開始評估' : '立即行動'}
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // --- Community Mode Component ( unchanged ) ---
        function CommunityMode() {
            return (
                <div className="fade-in space-y-6">
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-green-500">
                            <div className="text-gray-500 text-xs font-semibold uppercase">活躍社區居民</div>
                            <div className="text-3xl font-bold text-gray-800 mt-1">1,248</div>
                        </div>
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-orange-500">
                            <div className="text-gray-500 text-xs font-semibold uppercase">已識別的急切需求 (Gaps)</div>
                            <div className="text-3xl font-bold text-gray-800 mt-1">86</div>
                        </div>
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-blue-500">
                            <div className="text-gray-500 text-xs font-semibold uppercase">已連結的社區服務</div>
                            <div className="text-3xl font-bold text-gray-800 mt-1">432</div>
                        </div>
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-purple-500">
                            <div className="text-gray-500 text-xs font-semibold uppercase">整體韌性成長</div>
                            <div className="text-3xl font-bold text-gray-800 mt-1">+18%</div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="md:col-span-2 bg-white rounded-xl shadow-sm border border-gray-100 p-5">
                            <h2 className="font-bold text-gray-800 mb-4">即時社區韌性需求分佈 (Needs Map)</h2>
                            <div className="bg-gray-100 rounded-lg h-64 w-full flex items-center justify-center relative overflow-hidden">
                                <div className="absolute inset-0 opacity-20" style={{backgroundImage: 'url("https://www.transparenttextures.com/patterns/cubes.png")'}}></div>
                                <span className="z-10 bg-white/80 px-3 py-1 rounded text-sm font-medium text-gray-600 shadow">地理資訊與需求熱點 (Demo)</span>
                            </div>
                        </div>
                        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5 flex flex-col">
                            <h2 className="font-bold text-gray-800 mb-4">系統協調與介入建議 (Engage)</h2>
                            <div className="space-y-4 flex-grow overflow-y-auto">
                                <div className="p-3 border border-orange-200 bg-orange-50 rounded-lg">
                                    <div className="flex justify-between text-xs mb-1">
                                        <span className="font-bold text-orange-700">自動警報 (Alert)</span>
                                    </div>
                                    <h3 className="font-semibold text-sm text-gray-800">偵測到「極端天氣」查詢激增</h3>
                                    <p className="text-xs text-gray-600 mt-1">過去 24 小時內，本區有 45 名用戶查詢防水及物資準備。</p>
                                    <button className="mt-2 text-xs bg-orange-600 text-white px-3 py-1.5 rounded hover:bg-orange-700 w-full transition">發布庇護中心地圖及關愛隊聯絡方法</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
