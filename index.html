<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResiliLink - AI 韌性協調引擎原型</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; background-color: #f3f4f6; }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [mode, setMode] = useState('community'); 

            return (
                <div className="min-h-screen flex flex-col relative">
                    <header className="bg-white shadow-sm sticky top-0 z-10">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <i className="fa-solid fa-link text-blue-600 text-2xl"></i>
                                <span className="font-bold text-xl text-gray-900">ResiliLink</span>
                            </div>
                            <div className="flex bg-gray-100 p-1 rounded-lg">
                                <button onClick={() => setMode('personal')} className={`px-4 py-1.5 rounded-md text-sm font-medium transition-colors ${mode === 'personal' ? 'bg-white shadow text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}>個人模式 (Personal)</button>
                                <button onClick={() => setMode('community')} className={`px-4 py-1.5 rounded-md text-sm font-medium transition-colors ${mode === 'community' ? 'bg-white shadow text-green-600' : 'text-gray-500 hover:text-gray-700'}`}>社區模式 (Community)</button>
                            </div>
                        </div>
                    </header>

                    <main className="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
                        {mode === 'personal' ? <PersonalMode /> : <CommunityMode />}
                    </main>
                </div>
            );
        }

        // --- Assessment Modals (from previous updates) ---
        function MentalAssessmentModal({ onClose }) { /* ... hidden for brevity, keeping existing code logic ... */
            return <div className="fixed inset-0 z-50 flex items-center justify-center modal-overlay p-4"><div className="bg-white rounded-2xl shadow-xl w-full max-w-md p-6"><h3 className="font-bold mb-4">情緒與壓力評估</h3><button onClick={onClose} className="w-full bg-blue-600 text-white py-2 rounded">關閉並返回</button></div></div>;
        }
        function TyphoonAssessmentModal({ onClose }) {
            return <div className="fixed inset-0 z-50 flex items-center justify-center modal-overlay p-4"><div className="bg-white rounded-2xl shadow-xl w-full max-w-md p-6"><h3 className="font-bold mb-4">極端天氣防禦力評估</h3><button onClick={onClose} className="w-full bg-blue-600 text-white py-2 rounded">關閉並返回</button></div></div>;
        }

        // --- Personal Mode Component (Simplified for brevity, preserving functionality) ---
        function PersonalMode() {
            const [chatInput, setChatInput] = useState('');
            const [messages, setMessages] = useState([{ sender: 'ai', text: '你好！我是你的 ResiliLink 韌性協調引擎。你可以輸入任何你面對嘅挑戰，例如：「最近壓力好大」、「聽日打風點算」。' }]);
            const [tasks, setTasks] = useState([]);
            
            const handleSend = () => {
                if (!chatInput.trim()) return;
                const input = chatInput;
                setMessages(prev => [...prev, { sender: 'user', text: input }]);
                setChatInput('');
                
                setTimeout(() => {
                    setMessages(prev => [...prev, { sender: 'ai', text: '已從知識庫檢索相關指引，為你生成專屬「韌性行動清單」。' }]);
                    if (input.includes('風') || input.includes('雨')) {
                        setTasks([{ id: 'w1', phase: 'Assess', title: '颱風防禦力評估', desc: '點擊進行快速評估', icon: 'fa-cloud-bolt', color: 'text-orange-500' }]);
                    } else {
                        setTasks([{ id: 'm1', phase: 'Assess', title: '情緒與壓力評估', desc: '點擊進行互動問卷', icon: 'fa-heart-pulse', color: 'text-orange-500' }]);
                    }
                }, 1000);
            };

            return (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-8 h-full fade-in">
                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col h-[600px]">
                        <div className="p-4 border-b border-gray-100 bg-blue-50 rounded-t-xl"><h2 className="font-semibold text-blue-800"><i className="fa-solid fa-robot mr-2"></i>智能協調對話</h2></div>
                        <div className="flex-grow p-4 overflow-y-auto space-y-4 bg-gray-50">
                            {messages.map((msg, idx) => (
                                <div key={idx} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`max-w-[80%] rounded-lg p-3 text-sm ${msg.sender === 'user' ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white text-gray-800 shadow-sm border border-gray-100 rounded-bl-none'}`}>{msg.text}</div>
                                </div>
                            ))}
                        </div>
                        <div className="p-4 bg-white border-t border-gray-100"><div className="flex gap-2"><input type="text" value={chatInput} onChange={(e) => setChatInput(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && handleSend()} className="flex-grow border rounded-lg px-4 py-2" placeholder="輸入問題..." /><button onClick={handleSend} className="bg-blue-600 text-white px-4 py-2 rounded-lg"><i className="fa-solid fa-paper-plane"></i></button></div></div>
                    </div>
                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col h-[600px] overflow-hidden">
                        <div className="p-4 border-b border-gray-100 bg-gray-50"><h2 className="font-semibold text-gray-800"><i className="fa-solid fa-list-check mr-2"></i>行動清單</h2></div>
                        <div className="flex-grow p-6 overflow-y-auto bg-white">
                            {tasks.map((task, idx) => (
                                <div key={idx} className="p-4 rounded-xl border border-gray-100 shadow-sm bg-white mb-4"><h3 className="font-bold">{task.title}</h3><p className="text-sm">{task.desc}</p></div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // --- Community Mode Component (NEW AI CAMPAIGN BUILDER) ---
        function CommunityMode() {
            const [campaignInput, setCampaignInput] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [campaignPlan, setCampaignPlan] = useState(null);
            const [logMessage, setLogMessage] = useState('');

            const handleGenerate = () => {
                if (!campaignInput.trim()) return;
                setIsGenerating(true);
                setCampaignPlan(null);
                
                // Simulate RAG and LLM process for Campaign Building
                setLogMessage('🔍 正在檢索 Vector Database (HKO-HEAT-002 及 SWD-ELDERLY-04)...');
                
                setTimeout(() => {
                    setLogMessage('⚙️ 分析區內人口數據及高危群組分佈...');
                }, 1000);

                setTimeout(() => {
                    setLogMessage('✍️ 運用大語言模型 (LLM) 撰寫活動企劃及宣傳短訊...');
                }, 2000);

                setTimeout(() => {
                    setIsGenerating(false);
                    setCampaignPlan({
                        title: "盛夏防暑關懷大行動 (長者專項)",
                        target: "區內 65歲以上，缺乏照顧者支援之長者",
                        targetCount: 152,
                        process: [
                            "第一階段：系統自動向目標名單發送防中暑 SMS 及一鍵預約連結",
                            "第二階段：義工根據預約名單，上門派發消暑物資包 (清涼噴霧、電解質飲品)",
                            "第三階段：協助長者在家中開啟 ResiliLink 個人模式，設定高溫自動語音提醒"
                        ],
                        resources: ["電解質水 x 200", "便攜風扇 x 150", "社工/義工 15名"],
                        smsDraft: "【中心關懷】陳伯伯，本週天氣酷熱，中心下週三會安排義工探訪並派發消暑包。請點擊此連結確認預約：[系統連結]，或回覆 1 聯絡社工。"
                    });
                }, 3500);
            };

            return (
                <div className="fade-in space-y-6">
                    {/* KPI Cards */}
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-green-500">
                            <div className="text-gray-500 text-xs font-semibold uppercase">活躍社區居民</div>
                            <div className="text-3xl font-bold text-gray-800 mt-1">1,248</div>
                        </div>
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-blue-500">
                            <div className="text-gray-500 text-xs font-semibold uppercase">已備案義工數量</div>
                            <div className="text-3xl font-bold text-gray-800 mt-1">124</div>
                        </div>
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-orange-500">
                            <div className="text-gray-500 text-xs font-semibold uppercase">潛在高危對象 (未介入)</div>
                            <div className="text-3xl font-bold text-gray-800 mt-1">86</div>
                        </div>
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-purple-500">
                            <div className="text-gray-500 text-xs font-semibold uppercase">整體韌性成長</div>
                            <div className="text-3xl font-bold text-gray-800 mt-1">+18%</div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        {/* Campaign Builder Input */}
                        <div className="bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col h-[550px]">
                            <div className="p-5 border-b border-gray-100 bg-blue-50 rounded-t-xl">
                                <h2 className="font-bold text-blue-800"><i className="fa-solid fa-wand-magic-sparkles mr-2"></i>AI 韌性計劃生成器 (Campaign Design)</h2>
                                <p className="text-xs text-blue-600 mt-1">輸入您想舉辦的活動概念，AI 會自動為您對接指引、撰寫流程並篩選對象。</p>
                            </div>
                            <div className="p-5 flex flex-col flex-grow relative">
                                <label className="text-sm font-semibold text-gray-700 mb-2">請描述您想舉辦的活動或目標：</label>
                                <textarea 
                                    className="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none resize-none h-32"
                                    placeholder="試輸入：「我想針對區內獨居長者，搞一個預防中暑嘅活動」"
                                    value={campaignInput}
                                    onChange={(e) => setCampaignInput(e.target.value)}
                                ></textarea>
                                
                                <button 
                                    onClick={handleGenerate}
                                    disabled={isGenerating}
                                    className={`mt-4 w-full py-3 rounded-lg font-bold text-white transition ${isGenerating ? 'bg-blue-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700 shadow-md'}`}
                                >
                                    {isGenerating ? 'AI 正在生成計劃中...' : '生成活動企劃 (Generate)'}
                                </button>

                                {isGenerating && (
                                    <div className="mt-8 bg-gray-50 p-4 rounded-lg border border-gray-200">
                                        <div className="flex items-center gap-3">
                                            <i className="fa-solid fa-circle-notch fa-spin text-blue-600 text-xl"></i>
                                            <span className="text-sm font-mono text-gray-600">{logMessage}</span>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Campaign Builder Output */}
                        <div className="bg-gray-50 rounded-xl shadow-inner border border-gray-200 h-[550px] overflow-y-auto">
                            {!campaignPlan && !isGenerating && (
                                <div className="h-full flex flex-col items-center justify-center text-gray-400 p-8 text-center">
                                    <i className="fa-regular fa-file-lines text-5xl mb-4 opacity-50"></i>
                                    <p className="text-sm font-medium">企劃書預覽將在此顯示</p>
                                    <p className="text-xs mt-1">不再需要花費數小時撰寫計劃，AI 幾秒為你搞定。</p>
                                </div>
                            )}

                            {campaignPlan && (
                                <div className="p-6 fade-in">
                                    <div className="bg-white border border-gray-200 shadow-sm rounded-xl p-6 relative overflow-hidden">
                                        <div className="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>
                                        
                                        <div className="flex justify-between items-start mb-6">
                                            <div>
                                                <div className="text-xs font-bold text-blue-600 uppercase tracking-wide mb-1">自動生成草案</div>
                                                <h3 className="text-xl font-bold text-gray-900">{campaignPlan.title}</h3>
                                            </div>
                                            <span className="bg-green-100 text-green-700 text-xs font-bold px-2 py-1 rounded">就緒 (Ready)</span>
                                        </div>

                                        <div className="space-y-5">
                                            <div>
                                                <h4 className="text-sm font-bold text-gray-700 flex items-center gap-2 mb-2"><i className="fa-solid fa-users text-blue-500"></i> 目標受眾篩選 (Targeting)</h4>
                                                <div className="bg-blue-50 border border-blue-100 p-3 rounded-lg text-sm flex justify-between items-center">
                                                    <span className="text-gray-700">{campaignPlan.target}</span>
                                                    <span className="font-bold text-blue-700 bg-white px-2 py-1 rounded shadow-sm">{campaignPlan.targetCount} 人</span>
                                                </div>
                                            </div>

                                            <div>
                                                <h4 className="text-sm font-bold text-gray-700 flex items-center gap-2 mb-2"><i className="fa-solid fa-list-ol text-green-500"></i> 活動流程建議 (Workflow)</h4>
                                                <ul className="text-sm text-gray-600 space-y-2 pl-1">
                                                    {campaignPlan.process.map((step, i) => (
                                                        <li key={i} className="flex gap-2">
                                                            <span className="text-green-500 font-bold">•</span>
                                                            <span>{step}</span>
                                                        </li>
                                                    ))}
                                                </ul>
                                            </div>

                                            <div>
                                                <h4 className="text-sm font-bold text-gray-700 flex items-center gap-2 mb-2"><i className="fa-solid fa-box text-orange-500"></i> 所需物資與人力 (Resources)</h4>
                                                <div className="flex flex-wrap gap-2">
                                                    {campaignPlan.resources.map((res, i) => (
                                                        <span key={i} className="bg-orange-50 border border-orange-100 text-orange-700 text-xs px-2 py-1 rounded-md font-medium">{res}</span>
                                                    ))}
                                                </div>
                                            </div>

                                            <div>
                                                <h4 className="text-sm font-bold text-gray-700 flex items-center gap-2 mb-2"><i className="fa-solid fa-message text-purple-500"></i> 宣傳短訊草稿 (SMS Draft)</h4>
                                                <div className="bg-gray-100 p-3 rounded-lg text-sm text-gray-700 italic border-l-4 border-purple-400">
                                                    "{campaignPlan.smsDraft}"
                                                </div>
                                            </div>
                                        </div>

                                        <div className="mt-8 pt-4 border-t border-gray-100 flex gap-3">
                                            <button className="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg text-sm transition">
                                                <i className="fa-solid fa-paper-plane mr-2"></i>一鍵建立並群發短訊
                                            </button>
                                            <button className="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2 px-4 rounded-lg text-sm transition">
                                                匯出 PDF
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
